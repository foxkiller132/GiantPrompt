<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcane Automata</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="world"></canvas>

  <header id="hud" class="aa-frame">
    <div class="aa-brand">⟡ Arcane&nbsp;Automata</div>
    <div id="resource-bar" class="aa-resource-bar"></div>
    <div id="threat-meter" class="aa-threat" title="Threat scales with total Arcane Residue">
      <span class="aa-threat-label">Residue</span>
      <div class="aa-threat-track"><div id="threat-fill" class="aa-threat-fill"></div></div>
      <span id="threat-tier" class="aa-threat-tier">Calm</span>
    </div>
    <div class="aa-threat" title="Channel surplus Glyphs to purify the zone and win">
      <span class="aa-threat-label">Purifier</span>
      <div class="aa-threat-track"><div id="purifier-fill" class="aa-threat-fill" style="background:#5fd3a8"></div></div>
    </div>
  </header>

  <nav id="dock" class="aa-frame">
    <button class="aa-dock-btn" data-panel="inventory">Inventory</button>
    <button class="aa-dock-btn" data-panel="blueprints">Blueprint Library</button>
    <button class="aa-dock-btn" data-panel="golems">Golem Console</button>
    <button class="aa-dock-btn" data-panel="research">Research</button>
    <button class="aa-dock-btn" data-panel="network">Network</button>
    <span class="aa-dock-sep"></span>
    <button id="dock-save" class="aa-dock-btn">Save</button>
    <button id="dock-load" class="aa-dock-btn">Load</button>
  </nav>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
